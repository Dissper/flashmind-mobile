spring:
  application:
    name: flashmind-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/flashmind}
    username: ${DB_USERNAME:flashmind}
    password: ${DB_PASSWORD:flashmind}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

flashmind:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-long-secret-for-local-use-only-1234567890}
    expiration-hours: 24
  auth:
    allow-dev-login-bypass: false
    dev-bypass-email: ${DEV_BYPASS_EMAIL:demo@flashmind.local}
    dev-bypass-display-name: ${DEV_BYPASS_DISPLAY_NAME:Demo User}
  social:
    skip-id-token-validation: false
    google-client-id: ${GOOGLE_CLIENT_ID:replace-me}
    apple-client-id: ${APPLE_CLIENT_ID:replace-me}
    apple-team-id: ${APPLE_TEAM_ID:replace-me}
    apple-key-id: ${APPLE_KEY_ID:replace-me}
  document:
    max-file-size-bytes: 10485760
    max-pdf-pages: 60
    max-pptx-slides: 80
    max-docx-paragraphs: 500
    max-extracted-text-length: 16000
  generation:
    max-card-count: 20
    default-card-count: 10
    ai-provider: openai
    openai-api-key: ${OPENAI_API_KEY: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}
    openai-free-model: ${OPENAI_FREE_MODEL:gpt-4.1}
    openai-premium-model: ${OPENAI_PREMIUM_MODEL:gpt-5.4}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  subscription:
    free-generation-limit: 3
    free-max-cards: 10
    premium-max-cards: 20
    entitlement-name: ${REVENUECAT_ENTITLEMENT_NAME:premium}
    # TODO: Replace PRODUCT_ID with the monthly product configured in App Store Connect and Google Play.
    product-id: ${PRODUCT_ID:replace-me}
    # TODO: Replace REVENUECAT_API_KEY with your RevenueCat server API key for future backend syncs.
    revenuecat-api-key: ${REVENUECAT_API_KEY:}
    # TODO: Configure WEBHOOK_SECRET to match the authorization header configured in RevenueCat webhooks.
    webhook-secret: ${WEBHOOK_SECRET:}
